<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      CSP via meta tag — frame-ancestors removed (only works in HTTP headers).
      XSS protection, script/style/image/connect sources defined.
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://hamedo-back-end-production-63a0.up.railway.app https://api.callmebot.com;" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!--
      display=optional — browser uses cached font if available, otherwise
      falls back to system font immediately. Eliminates the 830ms render block.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;700;800&display=optional"
      rel="stylesheet"
    />

    <!-- SEO -->
    <title>HamedoSport — Official Padel Kits</title>
    <meta name="description" content="Official Padel kits in Egypt. BullPadel, NOX, Siux and more. Cash on Delivery. Shebin El Kom, Menofia." />
    <meta name="keywords" content="padel, kits, egypt, bullpadel, nox, siux, shebin el kom, menofia" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://hamedo-front-end.vercel.app/" />
    <meta property="og:title"       content="HamedoSport — Official Padel Kits" />
    <meta property="og:description" content="Shop Padel  kits in Egypt. Cash on Delivery." />
    <meta property="og:image"       content="https://res.cloudinary.com/dsbnexvia/image/upload/f_auto,q_auto,w_1200/v1773322480/black_shirt_nox_exeugt.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="HamedoSport — Official Padel Kits" />
    <meta name="twitter:description" content="Shop Padel  kits in Egypt. Cash on Delivery." />
    <meta name="twitter:image"       content="https://res.cloudinary.com/dsbnexvia/image/upload/f_auto,q_auto,w_1200/v1773322480/black_shirt_nox_exeugt.jpg" />

    <meta name="theme-color" content="#F4C430" />
    <link rel="icon" href="https://i.ibb.co/cKDd9XNZ/Whats-App-Image-2026-03-09-at-7-40-33-PM.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
